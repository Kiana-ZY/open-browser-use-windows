[project]
name = "open-browser-use-sdk"
version = "0.1.30"
description = "Python SDK for Open Browser Use for Windows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Kiana-ZY" }
]

[project.urls]
Homepage = "https://github.com/Kiana-ZY/open-browser-use-windows"
Repository = "https://github.com/Kiana-ZY/open-browser-use-windows"
Issues = "https://github.com/Kiana-ZY/open-browser-use-windows/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["open_browser_use*"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
